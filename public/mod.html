<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mod Dashboard (has delay)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">
    <div class="dashboard-wrapper">
        
        <!-- SIDEBAR NAVIGATION -->
        <aside class="sidebar">
            <h2 style="margin-top:0; margin-bottom: 20px; color: white; text-align:center; font-size:20px;">Mod Dashboard</h2>
            
            <button class="sidebar-btn active" style="cursor: default;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                App: Timer
            </button>

            <!-- Spacing to push bottom items down -->
            <div style="flex-grow: 1; min-height: 50px;"></div>
            
            <a href="https://discord.gg/GaQUq5PFk" target="_blank" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; background:#5865F2; color:white; text-decoration:none; border-radius:8px; font-weight:bold; font-size:14px; margin-top:10px; transition: background 0.2s;" onmouseover="this.style.background='#4752C4'" onmouseout="this.style.background='#5865F2'">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/></svg>
                Feedback
            </a>

            <div style="display:flex; align-items:center; gap:8px; margin-top:15px; cursor:pointer;" onclick="document.getElementById('enableFlash').click()">
                <span style="font-size:12px; font-weight:bold; color:#cbd5e1;">Green Flash (+Time)</span>
                <label class="switch" style="margin:0; pointer-events:none;">
                    <input type="checkbox" id="enableFlash" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="content-area">
            
            <!-- =============================== -->
            <!-- VIEW: TIMER APP -->
            <!-- =============================== -->
            <div id="view-timer" class="view-section active">
                
                <div class="glass-panel" style="text-align:center;">
                    <div class="timer-display" style="margin-bottom: 10px;">
                        <span id="timerText">00:00:00</span>
                    </div>
                    
                    <div class="btn-group">
                        <button id="btnToggle" class="btn primary">Start / Pause</button>
                        <button id="btnSet" class="btn secondary">Set Time (Reset)</button>
                    </div>
                </div>

                <div class="glass-panel mt">
                    <h3 style="display:flex; align-items:center; gap:5px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="14" r="8"/><path d="M12 10v4"/><path d="M10 2h4"/><path d="M18.8 6.2l-2-2"/></svg> Manual Control</h3>
                    <div class="btn-group">
                        <input type="text" id="manualSecs" placeholder="Ex: 60 or 01:30" />
                        <button id="btnAdd" class="btn success">Add</button>
                        <button id="btnRemove" class="btn danger">Remove</button>
                    </div>
                </div>

                <div class="glass-panel mt">
                    <h3 style="display:flex; align-items:center; gap:5px; margin-bottom: 15px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg> Event Values</h3>
                    <div class="grid">
                        <div><label>Secs per Sub:</label><input type="number" id="subTime"></div>
                        <div><label>Secs per 100 Bits:</label><input type="number" id="bitTime"></div>
                        <div><label>Secs per $1 SE Tip:</label><input type="number" id="tipTime"></div>
                        <div><label>Secs per $1 Ko-fi:</label><input type="number" id="kofiTime"></div>
                        <div><label>Secs per Follower:</label><input type="number" id="followTime"></div>
                        <div><label>Secs per Raider:</label><input type="number" id="raidTime"></div>
                    </div>
                </div>

                <div class="glass-panel mt">
                    <h3 style="font-size:16px; display:flex; align-items:center; gap:5px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg> Action History</h3>
                    <ul id="historyList" style="list-style:none; padding:0; margin:0; font-size:12px; color:#cbd5e1; max-height:100px; overflow-y:auto;">
                    </ul>
                </div>
                
            </div>

            <!-- GLOBAL SAVE BUTTON -->
            <button id="btnSave" class="btn primary mt" style="width:100%; display:flex; justify-content:center; align-items:center; gap:5px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> Save All Settings
            </button>
            
        </main>
    </div>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="mod.js"></script>
</body>
</html>
