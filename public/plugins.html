<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plugins · CSApp</title>
    <link rel="stylesheet" href="/style.css?v=7">
</head>
<body class="admin-body">
    <main class="plugin-container">
        <header class="glass-panel plugin-heading">
            <div>
                <h1>Plugins da comunidade</h1>
                <p>Instala apenas ZIPs de fontes em que confias. Os plugins de overlay correm isolados no browser.</p>
            </div>
            <a href="/" class="btn secondary">← Voltar ao Dashboard</a>
        </header>

        <section class="glass-panel plugin-install">
            <h2>Instalar plugin</h2>
            <label for="pluginZip">Escolhe um ZIP (máx. 5 MB)</label>
            <input id="pluginZip" type="file" accept=".zip,application/zip">
            <p id="status" class="plugin-status" role="status" aria-live="polite"></p>
        </section>

        <section class="glass-panel">
            <h2>Plugins instalados</h2>
            <div id="pluginList"></div>
        </section>
    </main>
    <script src="/plugins.js?v=2"></script>
</body>
</html>
